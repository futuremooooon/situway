<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SituWay</title>
<meta name="theme-color" content="#3182F6">
<meta name="description" content="출퇴근 경로와 캘린더 일정에 맞춰 업무 영어를 연습하는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width app column, header + scrolling body + bottom tab bar; sheets slide over the column. Tone: flat white cards on cool grey, one blue for action */
  --brand:#3182F6; --brand-text:#1B64DA; --on-brand:#FFFFFF; --brand-soft:#E8F3FF; --brand-deep:#1B5FCC; --brand-soft-deep:#C9E0FC; --xp:#FFB800; --xp-soft:#FFF5D6; --xp-ink:#8A5A00;
  --accent:#3182F6; --accent-ink:#1B64DA; --accent-soft:#E8F3FF;
  --travel:#028A55; --travel-soft:#E3F6EC;
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F9FAFB; --ink:#191F28; --muted:#6B7684; --line:#E5E8EB;
  --ok:#028A55; --ok-soft:#E3F6EC; --warn:#C2410C;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#3182F6; --brand-text:#6AA6FA; --on-brand:#FFFFFF; --brand-soft:#1C2A40; --brand-deep:#1B4E9E; --brand-soft-deep:#121C2C; --xp:#FFC933; --xp-soft:#3A3010; --xp-ink:#FFD866;
    --accent:#3182F6; --accent-ink:#8DBBFB; --accent-soft:#1C2A40;
    --travel:#4CD59A; --travel-soft:#163327;
    --bg:#17171C; --surface:#202027; --surface-2:#2A2A32; --ink:#E9E9EB; --muted:#9E9EA6; --line:#33333D;
    --ok:#4CD59A; --ok-soft:#163327; --warn:#FDBA74;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#3182F6; --brand-text:#6AA6FA; --on-brand:#FFFFFF; --brand-soft:#1C2A40; --brand-deep:#1B4E9E; --brand-soft-deep:#121C2C; --xp:#FFC933; --xp-soft:#3A3010; --xp-ink:#FFD866;
  --accent:#3182F6; --accent-ink:#8DBBFB; --accent-soft:#1C2A40;
  --travel:#4CD59A; --travel-soft:#163327;
  --bg:#17171C; --surface:#202027; --surface-2:#2A2A32; --ink:#E9E9EB; --muted:#9E9EA6; --line:#33333D;
  --ok:#4CD59A; --ok-soft:#163327; --warn:#FDBA74;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;background:var(--bg)}
header .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;font-size:21px;color:var(--ink)}
header .brand svg{flex:none}
.top-right{display:flex;align-items:center;gap:8px}
.ai-pill{font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface);border:0;color:var(--muted);white-space:nowrap}
.ai-pill.on{color:var(--brand-text);background:var(--brand-soft)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
main > *{flex-shrink:0}
main{flex:1;overflow-y:auto;padding:4px 16px 110px;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:6px 4px max(18px, calc(6px + env(safe-area-inset-bottom)))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);padding:6px 0;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.015em}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.xs{font-size:13.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.card.hero{gap:14px}
.card.hero h2{font-size:21px;line-height:1.35}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec-title h2{font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--bg);border:0;color:var(--muted);white-space:nowrap}
.chip.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand-text)}
.chip.accent{background:var(--travel-soft);border-color:transparent;color:var(--travel)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn{border:0;background:var(--bg);border-radius:16px;padding:14px 18px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;box-shadow:0 4px 0 var(--line);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--brand-deep)}
.btn.brand{background:var(--brand-soft);color:var(--brand-text);box-shadow:0 4px 0 var(--brand-soft-deep)}
.btn.brand:active{box-shadow:0 1px 0 var(--brand-soft-deep)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.btn.sm.brand{box-shadow:0 3px 0 var(--brand-soft-deep)}
.btn.sm.primary{box-shadow:0 3px 0 var(--brand-deep)}
.btn:disabled{opacity:.5;cursor:default}
.seg-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg-picker{background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg-picker button{border:0;background:transparent;border-radius:10px;padding:10px 4px;font-size:16px;min-height:48px;color:var(--muted);font-weight:500}
.seg-picker button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.route{border:1.5px solid transparent;border-radius:16px;padding:14px;background:var(--surface-2);text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.route[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar > span{display:block;height:100%}
.timeline{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:52px 40px 1fr;gap:10px;align-items:start;padding:8px 0}
.tl-time{font-family:var(--mono);font-size:14px;color:var(--muted);padding-top:8px;font-weight:600}
.tl-dot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.tl-body{display:flex;flex-direction:column;gap:3px}
.fmt{font-weight:700;font-size:17px}
.reason{font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list > *{border-top:1px solid var(--line);padding:12px 0}
.list > *:first-child{border-top:0;padding-top:0}
.expr{display:flex;align-items:flex-start;gap:10px}
.expr .t{flex:1;min-width:0}
.en{font-weight:600}
.play{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-text)}
.pill-status{font-size:14px;font-weight:700;padding:6px 11px;border-radius:8px;border:0;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill-status.s1{background:var(--brand-soft);color:var(--brand-text)}
.pill-status.s2{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.progress{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.progress > span{display:block;height:100%;background:var(--brand);border-radius:99px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14.5px;color:var(--muted);font-weight:500}
.input,textarea.input,select.input{width:100%;border:1.5px solid transparent;background:var(--bg);border-radius:14px;padding:14px 16px;min-height:56px;font-size:17px}
.input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
textarea.input{resize:vertical;min-height:120px;line-height:1.55}
.input-row{display:flex;gap:6px;align-items:flex-end}
.input-row .input{flex:1}
.mic{width:56px;height:56px;flex:none;border-radius:12px;border:0;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-text)}
.mic.on{background:var(--brand);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(49,130,246,.45)}50%{box-shadow:0 0 0 10px rgba(49,130,246,0)}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.check i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;margin-top:1px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.check.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.check.no i{background:#FFF1E6;border-color:#FDBA74;color:var(--warn)}
.mail{border:0;border-radius:14px;background:var(--bg);padding:16px;font-size:16px;white-space:pre-wrap}
.mail-head{font-size:13.5px;color:var(--muted);margin-bottom:6px;white-space:normal}
.fix{border-left:3px solid var(--brand);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:2px;font-size:16px}
.fix s{color:var(--muted)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(6,14,28,.45)}
.sheet-in{width:100%;max-width:440px;height:100%;background:var(--bg);display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}.mic.on{animation:none}.ring-avatar{animation:none!important}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;background:var(--bg)}
.sheet-head h2{flex:1;font-size:19px}
.sheet-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:12px 16px max(28px, calc(12px + env(safe-area-inset-bottom)));background:var(--bg);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
/* player */
.segbar{display:flex;gap:3px}
.segbar span{height:10px;border-radius:99px;background:var(--line)}
.segbar span.done{background:var(--brand)}
.segbar span.cur{background:var(--brand);opacity:.45}
.line{padding:12px 14px;border-radius:14px;background:var(--surface)}
.line.cur{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.line .who{font-size:12px;color:var(--muted);font-weight:600}
.bigctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.bigctl .btn{min-height:64px;font-size:15px}
.bigctl .btn.brand{background:var(--brand);color:#fff}
.flash{border:0;background:var(--surface);border-radius:24px;min-height:250px;box-shadow:0 6px 0 var(--line);padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;width:100%}
.flash .ko{font-size:25px;font-weight:700}
.flash .en{font-size:24px;font-weight:700;color:var(--brand-text)}
.opt{width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;min-height:64px;font-size:17.5px;font-weight:600;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:#FDBA74;background:#FFF1E6;box-shadow:0 4px 0 #FDBA74}
/* call */
.call{background:#101013;color:#F2F2F3}
.call .sheet-body{align-items:stretch}
.ring{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.ring-avatar{width:110px;height:110px;border-radius:50%;background:#3182F6;display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff;animation:ringp 1.4s infinite}
@keyframes ringp{0%,100%{box-shadow:0 0 0 0 rgba(49,130,246,.55)}50%{box-shadow:0 0 0 18px rgba(49,130,246,0)}}
.ring-btns{display:flex;gap:40px;margin-top:20px}
.round{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.round.red{background:#F04452}.round.green{background:#03B26C}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:12px 16px;border-radius:20px;font-size:17px}
.bub.ai{align-self:flex-start;background:var(--surface);border:0}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff}
.call .bub.ai{background:#202027;border-color:#33333D;color:#F2F2F3}
.call .sheet-head,.call .sheet-foot{background:#17171C;border-color:#2C2C35;color:#F2F2F3}
.call .input{background:#202027;border-color:#33333D;color:#F2F2F3}
.call .mic,.call .icon-btn{background:#202027;border-color:#33333D;color:#F2F2F3}
.drive-line{font-size:28px;line-height:1.45;font-weight:600;text-align:center;padding:12px}
.drive-mic{width:140px;height:140px;border-radius:50%;border:0;background:#3182F6;color:#fff;display:grid;place-items:center;margin:0 auto}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:16px;font-size:15.5px;font-weight:600;z-index:50;max-width:min(400px,92vw);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.ring-svg{display:block}
.empty{padding:20px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:15.5px}
.dayhead{font-size:15.5px;font-weight:700;color:var(--muted);margin:8px 4px -4px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
.ev .time{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--muted);padding-top:1px}
.ev.learn .title{color:var(--brand-text)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted);border:0;border-radius:12px;padding:9px 14px;min-height:42px;background:var(--bg)}
.toggle[aria-pressed="true"]{color:var(--brand-text);background:var(--brand-soft);font-weight:700}
.note{font-size:15px;color:var(--muted);background:var(--surface);border:0;border-radius:14px;padding:12px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps div{font-size:14.5px;text-align:center;padding:9px 2px;border-radius:10px;background:var(--bg);color:var(--muted);border:0;font-weight:500}
.steps div.on{background:var(--brand);color:#fff;font-weight:700}
.steps div.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}


/* game layer */
.lvl{display:flex;align-items:center;gap:14px}
.lvl-badge{display:inline-flex;align-items:center;gap:6px;background:var(--xp-soft);color:var(--xp-ink);font-weight:800;font-size:15px;border-radius:12px;padding:6px 11px}
.xpbar{height:14px;border-radius:99px;background:var(--bg);overflow:hidden}
.xpbar > span{display:block;height:100%;border-radius:99px;background:var(--xp);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);transition:width .5s ease}
.quest{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.qicon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center}
.qdone{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-weight:800;font-size:14px}
.qdone.on{background:var(--ok);color:#fff}
.qbar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.qbar > span{display:block;height:100%;background:var(--ok);border-radius:99px}
.xp-chip{display:inline-flex;align-items:center;gap:3px;font-size:13.5px;font-weight:800;color:var(--xp-ink);background:var(--xp-soft);border-radius:8px;padding:3px 8px;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:18px;background:var(--surface-2);font-size:13.5px;font-weight:600}
.badge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.badge.locked{opacity:.45;filter:grayscale(1)}
.xpfloat{position:fixed;left:50%;top:38%;transform:translate(-50%,0);z-index:70;font-weight:800;font-size:30px;color:var(--xp-ink);background:var(--xp-soft);padding:10px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:xpup 1.3s ease-out forwards;pointer-events:none}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.levelup{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,20,40,.55)}
.levelup-in{background:var(--surface);border-radius:28px;padding:28px 24px;width:min(360px,90vw);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.celebrate{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.bigxp{font-size:34px;font-weight:800;color:var(--xp-ink)}
.mascot-say{position:relative;background:var(--surface);border-radius:18px;padding:12px 16px;font-size:16px;font-weight:600}
.feedback-bar{border-radius:18px;padding:14px 16px;font-size:16px;display:flex;flex-direction:column;gap:4px}
.feedback-bar.ok{background:var(--ok-soft);color:var(--ok)}
.feedback-bar.no{background:#FFF1E6;color:var(--warn)}
@media (prefers-reduced-motion:reduce){.xpfloat,.levelup-in,.bounce{animation:none}}

/* map-app style today */
:root{--map-bg:#EEF1F5;--map-road:#FFFFFF;--map-water:#CFE3F7;--map-land:#E2EBD9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-bg:#23232B;--map-road:#33333D;--map-water:#1D3047;--map-land:#26302A}}
:root[data-theme="dark"]{--map-bg:#23232B;--map-road:#33333D;--map-water:#1D3047;--map-land:#26302A}
.lv-pill{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:800;font-size:15px;color:var(--xp-ink)}
.lv-pill i{display:block;width:54px;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.lv-pill b{display:block;height:100%;background:var(--xp);border-radius:99px}
.evbar{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);border-radius:20px;padding:16px;color:var(--ink);box-shadow:0 3px 0 var(--line)}

.dchip{font-weight:800;font-size:15px;color:var(--brand-text);background:var(--brand-soft);border-radius:10px;padding:6px 10px}
.mapcard{border-radius:24px;overflow:hidden;background:var(--surface)}
.maptop{position:relative}
.mapchip{position:absolute;left:12px;top:12px;background:var(--surface);border-radius:12px;padding:7px 11px;font-size:14.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sheetlike{position:relative;margin-top:-18px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px 20px;display:flex;flex-direction:column;gap:14px}

.big-min{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}

.learn-min{font-size:28px;font-weight:800;color:var(--brand-text);line-height:1.1}
.segline{display:flex;gap:3px;height:26px}

.rplan{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;color:var(--muted);margin-top:2px}
.rplan span+span::before{content:"· ";}
.rdetail-h{display:flex;flex-direction:column;gap:2px}
.rdetail-h b{font-size:16px}
.fpick{display:flex;flex-wrap:wrap;gap:6px}
.fpick button{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;cursor:pointer}
.fpick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.rcontent{font-size:14.5px;line-height:1.45}
.lvbanner{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:16px;background:var(--brand-soft);color:var(--brand-text)}

.lvbanner.soon{background:var(--xp-soft);color:var(--xp-ink)}

@keyframes lvpulse{50%{transform:scale(1.02)}}
.lvstops{list-style:none;margin:6px 0 0;padding:0 0 0 14px;border-left:3px solid var(--line);display:grid;gap:6px;max-height:260px;overflow:auto}
.lvstops li{position:relative;font-size:15px;color:var(--muted)}
.lvstops li::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.lvstops li.past{opacity:.5}
.lvstops li.now{color:var(--ink);font-weight:700}
.lvstops li.now::before{background:var(--brand);border-color:var(--brand)}
.lvstops li.end{color:var(--ink)}
.lvstops em{font-style:normal;font-size:12px;color:var(--brand-text);margin-left:4px}
.segctl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.segctl button{border:0;background:transparent;padding:8px 0;border-radius:9px;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.segctl button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.calnav{display:flex;align-items:center;gap:6px}
.calnav b{flex:1;text-align:center;font-size:17px}
.calnav .iconbtn:first-child svg{transform:rotate(180deg)}
.iconbtn{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tg{padding:10px 8px;overflow:hidden}
.tg-head,.tg-allday,.tg-body{display:grid;gap:2px}
.tg-head{margin-bottom:6px}
.tg-day{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit}
.tg-day small{font-size:11px;color:var(--muted)}
.tg-day b{font-size:15px}
.tg-day.today b{background:var(--brand);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.tg-allday{padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:4px;align-items:start}
.tg-lab,.tg-hours span{font-size:11px;color:var(--muted);text-align:right;padding-right:6px}
.tg-hours span{display:block;transform:translateY(-6px)}
.tg-chip{display:block;width:100%;border:0;border-left:3px solid;border-radius:5px;padding:2px 4px;font:inherit;font-size:11px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-bottom:2px}
.tg-col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h,40px) - 1px),var(--line) calc(var(--h,40px) - 1px),var(--line) var(--h,40px))}
.tg-col.today{background-color:rgba(49,130,246,.04)}
.tg-ev{position:absolute;left:1px;right:2px;border:0;border-left:3px solid;border-radius:6px;padding:3px 5px;text-align:left;font:inherit;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tg-ev b{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tg-ev span{font-size:11px;opacity:.85}
.tg-now{position:absolute;left:0;right:0;height:2px;background:#F04452;z-index:2}
.tg-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#F04452}
.mg{padding:10px 6px}
.mg-dow,.mg-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mg-dow span{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.mg-cell{border:0;background:transparent;min-height:64px;border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;gap:2px;align-items:stretch;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.mg-cell.other{opacity:.35}
.mg-cell.sel{background:var(--brand-soft)}
.mg-n{font-size:13px;font-weight:600;text-align:center;line-height:22px}
.mg-cell.today .mg-n{background:var(--brand);color:#fff;border-radius:50%;width:22px;align-self:center}
.mg-ev{font-size:10px;font-weight:600;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.mg-more{font-size:10px;color:var(--muted);text-align:center}
.mg-item{border:0;background:transparent;width:100%;font:inherit;color:var(--ink);cursor:pointer;padding:0}
.cal-legend{gap:10px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.thumb{position:relative;flex:none;display:block;border-radius:16px;box-shadow:0 4px 12px rgba(30,60,140,.14)}
.thumb svg{display:block}
.thumb em{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:11px;font-weight:700;line-height:1;padding:3px 5px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
.odusage{padding:10px 12px;border-radius:12px;background:var(--brand-soft)}
.lvst,.lvpath{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;color:var(--ink);font:inherit}
.lvpath{flex-direction:column;align-items:stretch;gap:8px;text-align:left}
.rule{display:flex;align-items:flex-start;gap:12px;padding:12px 0}
.rule + .rule{border-top:1px solid var(--line)}
.switch{flex:none;width:48px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.input.sm{height:34px;padding:0 8px;font-size:14px;width:auto}
.callnext{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.walkrest{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px;border-radius:14px;background:var(--bg)}
.walkrest svg{color:var(--muted)}
.pvid{border-radius:14px;overflow:hidden;background:#000;position:relative}
.pvid-scene{aspect-ratio:16/9}
.pvid-scene svg{display:block;width:100%;height:100%}
.pvid-sub{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pvid-sub span,.pvid-sub small{background:rgba(0,0,0,.72);color:#fff;border-radius:6px;padding:3px 8px;font-size:15px;font-weight:600}
.pvid-sub small{font-size:13px;font-weight:500}
.rdetail summary{cursor:pointer;font-weight:700;color:var(--brand-text);font-size:16px;list-style:none}
.rdetail summary::-webkit-details-marker{display:none}
.rdetail summary::after{content:" ›"}
.rdetail[open] summary::after{content:" ˅"}
.rsteps{margin-top:12px}
.rstep{display:grid;grid-template-columns:22px 1fr;gap:12px}
.rrail{display:flex;flex-direction:column;align-items:center}
.rdot{width:16px;height:16px;border-radius:50%;background:var(--surface);border:4px solid #8B95A1;flex:none;margin-top:4px}
.rdot.end{border-color:#F04452}
.rline{flex:1;width:6px;border-radius:3px;min-height:36px;margin:2px 0}
.rline.dash{background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 9px);width:3px}
.rbody{padding-bottom:16px;display:flex;flex-direction:column;gap:6px}
.learn-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand-text);font-weight:700;font-size:14.5px;border-radius:10px;padding:5px 10px}
.lpill{display:inline-flex;align-items:center;gap:4px;color:#fff;font-weight:800;font-size:13.5px;border-radius:8px;padding:3px 8px;white-space:nowrap}
.seg-picker.two{grid-template-columns:1fr 1fr}
.btn.xl{min-height:62px;font-size:19px;border-radius:18px}
.alert-toggle{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-size:14.5px;padding:2px 0;text-align:left}
.alert-toggle b{margin-left:auto;color:var(--brand-text)}
.alert-toggle[aria-pressed="false"] b{color:var(--muted)}
.qcard summary{list-style:none;cursor:pointer}
.qcard summary::-webkit-details-marker{display:none}
.qdots{display:flex;gap:6px}
.qdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.qdots i.on{background:var(--ok)}
/* navigation-style player */
.navb{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--lc)}
.navb-top{display:flex;justify-content:space-between;align-items:center}
.navb-min{font-size:26px;font-weight:800}
.navb-main{font-size:23px;line-height:1.35}
.navb-main b{font-weight:800}
.navb-sub{font-size:15px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navb-sub span{display:inline-flex;align-items:center;gap:4px;color:var(--brand-text);font-weight:700}
.alertb{display:flex;align-items:center;gap:12px;border-radius:20px;padding:16px;background:#FFF4E5;color:#7A3E00;font-size:16px;animation:pop .3s ease-out}
.alertb.arrive{background:#FFE8EA;color:#A0202C}
.alertb b{font-size:20px}
.now-line{background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px;min-height:180px;justify-content:center}
.now-line .who{font-size:14.5px;font-weight:700;color:var(--muted)}
.en-big{font-size:24px;font-weight:700;line-height:1.4}

/* ===== readability + map-app style controls (overrides) ===== */
:root{--muted:#4E5968}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#B4B4BC}}
:root[data-theme="dark"]{--muted:#B4B4BC}
body{font-size:17px;line-height:1.6}
.small{font-size:15.5px}
.xs{font-size:15px}
.muted{color:var(--muted)}
.reason{font-size:15.5px}
.chip{font-size:14.5px}
.pill-status{font-size:14.5px}
.xp-chip{font-size:14.5px;padding:5px 10px}
.lead{font-size:17.5px;line-height:1.65}
.en{font-size:18px}
.fmt{font-size:18px}
.evtitle{font-size:18.5px;line-height:1.4}
h2{font-size:21px}
/* buttons: flat, thin border, like a map app */
.btn{border:1px solid var(--line);background:var(--surface);box-shadow:none;border-radius:12px;min-height:52px;font-size:17px;font-weight:700;transition:background .12s}
.btn:active{transform:none;box-shadow:none;background:var(--bg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:none}
.btn.primary:active{background:var(--brand-deep);box-shadow:none}
.btn.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand-text);box-shadow:none}
.btn.brand:active{box-shadow:none;filter:brightness(.96)}
.btn.sm,.btn.sm.brand,.btn.sm.primary{min-height:44px;font-size:16px;padding:8px 14px;border-radius:10px;box-shadow:none}
.btn.xl{min-height:60px;font-size:19px;border-radius:14px}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.4}
.evbar{box-shadow:none;border:1px solid var(--line)}
.evbar:active{transform:none;box-shadow:none;background:var(--bg)}
.opt{box-shadow:none;border:1.5px solid var(--line)}
.opt:active{transform:none;box-shadow:none}
.opt.right{box-shadow:none}.opt.wrong{box-shadow:none}
.flash{box-shadow:none;border:1px solid var(--line)}
.play{width:48px;height:48px;border-radius:14px}
.mic{width:56px;height:56px}
.qicon svg{flex:none}
/* list items with actions on their own row (no overlap) */
.exitem{display:flex;flex-direction:column;gap:10px}
.exact{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.expr .t{display:flex;flex-direction:column;gap:2px}
/* route search panel */
.rsearch{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.rs-fields{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rs-field{display:flex;align-items:center;gap:10px;border:0;background:var(--surface);padding:13px 14px;font-size:17px;font-weight:600;text-align:left;min-height:52px;color:var(--ink)}
.rs-field + .rs-field{border-top:1px solid var(--line)}
.rs-field span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-dot{flex:none;width:12px;height:12px;border-radius:50%}
.rs-dot.from{background:#3182F6}.rs-dot.to{background:#F04452}
.rs-swap{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.rmodes{display:flex;gap:8px;padding:0 14px 12px}
.rmodes button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600;color:var(--muted);min-height:44px}
.rmodes button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ropt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.ropt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.segline{height:28px}
.segline span{font-size:13.5px}
.learn-chip{font-size:15.5px}
.mapchip{font-size:15.5px}
.mapframe{border-radius:16px;overflow:hidden}
.sheetlike{margin-top:-16px}
.quest{width:100%;border:0;background:none;padding:12px 0;color:var(--ink);font-size:17px}
.qdone{width:34px;height:34px}
.alert-toggle{font-size:15.5px;width:100%}
.alert-toggle span{flex:1}
/* search sheet */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--brand);border-radius:14px;padding:0 14px;min-height:56px;color:var(--muted)}
.searchbox input{flex:1;border:0;background:transparent;font-size:18px;outline:none;min-height:52px;color:var(--ink)}
.reslist{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden}
.res{display:flex;align-items:center;gap:12px;border:0;background:var(--surface);padding:14px;text-align:left;color:var(--ink);border-top:1px solid var(--line);width:100%}
.res:first-child{border-top:0}
.res:active{background:var(--bg)}
.res-ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.res-ic.fav{background:var(--brand-soft);color:var(--brand-text)}
.res-t{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;font-size:17px}
.res-t b{font-size:17.5px}
.res-st{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.res-h{font-size:16px;color:var(--muted);margin:6px 4px -4px}
mark{background:transparent;color:var(--brand-text);font-weight:800}
/* onboarding */
.onb .sheet-in{background:var(--bg)}
.onb .input{background:var(--surface);border-color:var(--line)}
.pickmap text{pointer-events:none}
.onb-head{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.obprog{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.obprog span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.onb-body h1{font-size:28px;line-height:1.35}
.choice{display:flex;align-items:center;gap:14px;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.selcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--brand);border-radius:16px;padding:14px}
.pickmap{display:block;border-radius:16px;touch-action:manipulation}
.checkrow{display:flex;align-items:center;gap:10px;font-size:16.5px;padding:6px 2px}
.checkrow input{width:22px;height:22px;accent-color:var(--brand)}
.mascot-say{font-size:17px;line-height:1.55}
.navb-sub{font-size:16px}
.tl-time{font-size:15px}
nav.tabs button{font-size:13.5px}

/* bigger top bar */
header.top{padding:18px 18px 12px}
header .brand{font-size:25px;gap:10px}
header .brand svg{width:36px;height:36px}
.lv-pill{font-size:17px;padding:10px 16px;gap:10px}
.lv-pill i{width:70px;height:10px}
header.top .icon-btn{width:48px;height:48px}
header.top .icon-btn svg{width:28px;height:28px}
/* what today's learning is for */
.studyfor{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--bg);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink)}
.sf-k{align-self:flex-start;font-size:14px;font-weight:700;color:var(--brand-text);background:var(--brand-soft);border-radius:8px;padding:4px 8px}
.sf-v{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:16px}
.sf-v b{font-size:17px}

/* dashboard + FAB */
.dash{gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats > div{background:var(--bg);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.stat-v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat-v small{font-size:15px;font-weight:700;margin-left:1px;color:var(--muted)}
.stat-k{font-size:14.5px;color:var(--muted);font-weight:600}
.rec{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;color:var(--ink);text-align:left}

function classify(title){
  const t = title || "";
  if (/연차|휴가|여행|vacation|pto|holiday|항공|flight/i.test(t)) return "travel";
  if (/출장|business trip/i.test(t)) return "trip";
  const eng = (t.match(/[A-Za-z]/g)||[]).length > t.replace(/\s/g,"").length * 0.5;
  if (/call|통화|전화/i.test(t) && (eng || /해외|영어|미국|글로벌/.test(t))) return "en-call";
  if (eng || /영어|해외|지사|바이어|글로벌|싱가포르|미국|외국/.test(t)) return "en-meeting";
  return "work";
}

const CONFIG = Object.assign({GOOGLE_CLIENT_ID:"", ODSAY_KEY:"", LIVE_REAL:false}, window.SITUWAY_CONFIG || {});

function aiPill(){ const p = $("#aiPill"); if (!p) return; p.textContent = SAMPLE ? "AI 연결됨" : "시연 모드"; p.classList.toggle("on", !!SAMPLE); p.title = SAMPLE ? "Claude가 피드백과 대화를 만들어요" : "AI 없이 규칙 기반으로 동작해요"; }
(function initCaps(){
  const c = window.claude;
  if (!c || typeof c.use !== "function") { setTimeout(() => { if (CONFIG.GOOGLE_CLIENT_ID) loadScript("https://accounts.google.com/gsi/client").catch(() => {}); aiPill(); GC.state = CONFIG.GOOGLE_CLIENT_ID ? "gis" : "ics"; if (S.tab === "calendar" && !$("#layer").innerHTML) render(); }, 50); return; }
  c.use("sample").then(s => { SAMPLE = s; aiPill(); }).catch(() => aiPill());
  c.use("tts").then(t => { TTS = t; }).catch(()=>{});
  c.use("mcp").then(m => { MCP = m; gcalStatus(); }).catch(() => { GC.state = CONFIG.GOOGLE_CLIENT_ID ? "gis" : "ics"; });
  c.use("dictation").then(d => {
    if (!d) return; DICT = d;
    d.onFinal(({text}) => { const el = document.getElementById(micTarget); if (el && text) { el.value = (el.value ? el.value.trim() + " " : "") + text.trim(); el.dispatchEvent(new Event("input", {bubbles:true})); } const h = $("#micHint"); if (h) h.textContent = ""; });
    d.onPartial(({text}) => { const h = $("#micHint"); if (h) h.textContent = text ? "듣는 중: " + text : ""; });
    d.onState(({state}) => {
      const was = micOn; micOn = state === "listening";
      document.querySelectorAll(".mic").forEach(m => m.classList.toggle("on", micOn));
      // drive mode is hands-free: when listening ends, send what was heard
      if (was && !micOn && CV && CV.c.mode === "drive") { const i = $("#cvIn"); if (i && i.value.trim()) setTimeout(cvSend, 300); }
    });
  }).catch(()=>{});
  setTimeout(aiPill, 10500);
})();
/* keep generated copy plain: no emoji, no exclamation, no assistant filler */
const STYLE = `
Writing style for every string you produce: plain, short and specific. Korean text uses natural 해요체 like a colleague's memo. Do not use praise words (완벽해요, 훌륭해요, 멋져요, 대단해요, great, excellent, amazing, perfect), exclamation marks, emojis, or service phrases (~해 드릴게요, 도와드릴게요, Great question, I'd be happy to help, Absolutely, Certainly). Say what was good or wrong in concrete terms.`;
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu;
const plainText = v => typeof v === "string" ? v.replace(EMOJI_RE, "").replace(/([가-힣])!+/g, "$1.").replace(/[ \t]{2,}/g, " ").trim() : Array.isArray(v) ? v.map(plainText) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, plainText(x)])) : v;
async function askJSON(prompt, fallback){
  if (!SAMPLE) return fallback();
  try { const v = await SAMPLE.json(prompt + STYLE, {modelTier:"quick"}); return v ? plainText(v) : fallback(); }
  catch(e){ if (e && e.code === "rate_limited") toast("AI 요청이 많아요. 잠시 뒤 다시 시도해 주세요."); if (e && e.code === "not_granted") { SAMPLE = null; aiPill(); } return fallback(); }
}
async function askText(messages, fallback){
  if (!SAMPLE) return fallback();
  try { const r = await SAMPLE(messages, {modelTier:"quick", cache:false}); return (r && r.text ? plainText(r.text) : "") || fallback(); }

/* ---------- calendar rules: when the practice call rings ---------- */
const hmOn = (d, s) => { const [h, m] = s.split(":").map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
const evEnd = e => e.end ? new Date(e.end) : addMin(e.start, e.allDay ? 1440 : 60);
function tripOn(d){ return S.events.find(e => e.allDay && (e.kind === "trip" || e.kind === "travel") && sod(e.start) <= sod(d) && sod(d) < evEnd(e)); }
function planCall(day){
  const R = S.rules, len = S.phone.len, base = hmOn(day, S.phone.time);
  if (R.pauseTrips) { const t = tripOn(base); if (t) return {skip:true, base, reason:`${t.title} 기간이라 쉬어요`}; }
  const buf = R.buffer || 0, ws = hmOn(base, R.workStart), we = hmOn(base, R.workEnd);
  const dayEvs = S.events.filter(e => !e.allDay && sod(e.start).getTime() === sod(base).getTime());
  const clash = c => { const end = addMin(c, len);
    if (R.avoidMeetings) { const e = dayEvs.find(e => c < addMin(evEnd(e), buf) && end > addMin(e.start, -buf)); if (e) return {e}; }
    if (R.workHours && c < we && end > ws) return {work:true};
    return null; };
  const why = clash(base);
  if (!why) return {time:base, base, moved:false};
  let best = null;
  for (let m = 7 * 60; m <= 22 * 60 - len; m += 5) { const c = new Date(base); c.setHours(0, m, 0, 0); if (!clash(c) && (!best || Math.abs(c - base) < Math.abs(best - base))) best = c; }
  const reason = why.e ? `‘${why.e.title}’ ${fmtTime(why.e.start)} 일정과 겹쳐서 옮겼어요` : `근무시간(${R.workStart}–${R.workEnd})이라 옮겼어요`;
  return best ? {time:best, base, moved:true, reason} : {skip:true, base, reason:"규칙에 맞는 빈 시간이 없어 쉬어요"};
}
function callPlan(days){
  const out = [];
  for (let i = 0; i < (days || 8); i++) { const d = new Date(); d.setDate(d.getDate() + i); if (!S.phone.days.includes(DOW[d.getDay()])) continue; const p = planCall(d); if ((p.time || p.base) > new Date()) out.push(p); }
  return out;
}

const ODSAY = "https://api.odsay.com/v1/api/";
const odKey = () => CONFIG.ODSAY_KEY || (() => { try { return localStorage.getItem("situway-odsay-key") || ""; } catch(e){ return ""; } })();
let LN = null;
const geoDist = (a, b) => { const R = 6371000, r = Math.PI / 180, dLat = (b.y - a.y) * r, dLng = (b.x - a.x) * r; const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.y * r) * Math.cos(b.y * r) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
/* ODsay 무료 키는 하루 30회(모든 사용자 공유)라 아껴 씀: 결과 캐시 + 기기별 하루 한도 + 자주 가는 역은 검색 없이 선택 */
const OD_DAY_LIMIT = 5, OD_TOTAL = 30;
const odStore = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } };
const odToday = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
function odUsed(){ const c = odStore("situway-odsay-count"); return c && c.d === odToday() ? c.n : 0; }
const odLeft = () => Math.max(0, OD_DAY_LIMIT - odUsed());
async function odsay(api, params){
  const key = api + "?" + Object.keys(params).sort().map(k => k + "=" + params[k]).join("&");
  const cache = odStore("situway-odsay-cache") || {};
  const hit = cache[key];
  if (hit && Date.now() - hit.t < (api === "searchStation" ? 30 : 7) * 86400000) return hit.r;
  if (!odLeft()) throw new Error(`오늘 이 기기의 실제 검색 ${OD_DAY_LIMIT}회를 다 썼어요. 내일 다시 쓰거나 시연 경로로 보세요.`);
  odStore("situway-odsay-count", {d:odToday(), n:odUsed() + 1});
  const q = new URLSearchParams({...params, apiKey:odKey()});
  const r = await fetch(ODSAY + api + "?" + q.toString());
  const j = await r.json();
  const err = j.error && (Array.isArray(j.error) ? j.error[0] : j.error);
  if (err) throw new Error(err.msg || err.message || "ODsay 오류");
  const keys = Object.keys(cache); if (keys.length > 60) keys.sort((a, b) => cache[a].t - cache[b].t).slice(0, keys.length - 60).forEach(k => delete cache[k]);
  cache[key] = {t:Date.now(), r:j.result}; odStore("situway-odsay-cache", cache);
  return j.result;
}

function hereNow(){ return new Promise((res, rej) => { if (!navigator.geolocation) return rej(new Error("이 브라우저는 위치를 지원하지 않아요")); navigator.geolocation.getCurrentPosition(p => res({x:p.coords.longitude, y:p.coords.latitude}), e => rej(new Error(e.code === 1 ? "위치 권한을 허용해 주세요" : "현재 위치를 찾지 못했어요")), {enableHighAccuracy:true, timeout:12000, maximumAge:30000}); }); }
async function liveSearch(){

  try {
    const here = LN.from ? null : await hereNow(); const from = LN.from || {x:+here.x.toFixed(3), y:+here.y.toFixed(3)}; LN.fromName = LN.from ? LN.from.name : "현재 위치";

/* ---- navigation ---- */
function liveAlert(kind, msg, sub, say){
  LN.msg = msg; LN.sub = sub || ""; LN.alertKind = kind;
  if (say) { speakKo(say); try { navigator.vibrate && navigator.vibrate(kind === "now" ? [400, 150, 400, 150, 400] : [250, 120, 250]); } catch(e){} }
  if (say && document.visibilityState !== "visible" && "Notification" in window && Notification.permission === "granted") {
    const opt = {body:sub || "", tag:"situway-live", renotify:true, icon:"icon-192.png"};
    (navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : Promise.resolve(null)).then(r => r ? r.showNotification(msg, opt) : new Notification(msg, opt)).catch(() => {});
  }
}
function fireOnce(key, ...a){ if (LN.fired[key]) return; LN.fired[key] = 1; liveAlert(...a); }
function liveBegin(path){
  LN.path = path; LN.step = "nav"; LN.seg = 0; LN.idx = 0; LN.boarded = false; LN.fired = {}; LN.gps = null;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => { LN.wake = w; }).catch(() => {}); } catch(e){}
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  segIntro();
  if (path.demo) liveSimStart();
  else if (navigator.geolocation) LN.watch = navigator.geolocation.watchPosition(pos => liveTick({x:pos.coords.longitude, y:pos.coords.latitude, acc:pos.coords.accuracy, t:Date.now()}), e => { if (e.code === 1) { LN.msg = "위치 권한이 꺼져 있어요"; LN.sub = "브라우저 설정에서 위치를 허용하면 승하차 알림이 동작해요."; renderLive(); } }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  LN.clock = setInterval(() => liveTick(null), 5000);
  renderLive();
}
function segIntro(){
  const s = LN.path.subPath[LN.seg];
  if (s.trafficType === 3) { const nx = LN.path.subPath[LN.seg + 1]; liveAlert("walk", nx ? `${nx.startName}까지 걸어가요` : "도착지까지 걸어가요", `약 ${s.sectionTime}분 · ${s.distance || ""}${s.distance ? "m" : ""}`.replace(/ · $/, ""), null); }
  else liveAlert("ride", `${s.startName}에서 ${segLabel(s)} 타요`, s.way ? s.way : `${s.stationCount}정거장 뒤 ${s.endName}에서 내려요`, null);
}
function liveTick(g){
  if (!LN || LN.step !== "nav") return;
  if (g) LN.gps = g;
  const p = LN.path, s = p.subPath[LN.seg];
  const here = LN.gps, good = here && Date.now() - here.t < 30000 && here.acc < 200;
  if (s.trafficType === 3) {
    const nx = p.subPath[LN.seg + 1];
    if (nx && good) { const st0 = nx.passStopList ? nx.passStopList.stations[0] : {x:nx.startX, y:nx.startY}; const d = geoDist(here, st0);
      if (d < 250) fireOnce("near" + LN.seg, "board", `곧 ${nx.startName}이에요`, `${segLabel(nx)} 타는 곳 · 약 ${Math.round(d)}m`, `곧 ${nx.startName}입니다. ${segLabel(nx)} 탈 준비하세요.`);
      if (d < 60) { LN.seg++; LN.idx = 0; LN.boarded = false; segIntro(); } }
    if (!nx && good && geoDist(here, {x:s.endX, y:s.endY}) < 60) fireOnce("arrive", "now", "도착했어요", "안내를 마칠게요.", "목적지에 도착했습니다.");
  } else {
    const st = s.passStopList.stations, last = st.length - 1;
    let idx = LN.idx;
    if (good) { let best = idx, bd = Infinity; for (let i = idx; i <= last; i++) { const d = geoDist(here, st[i]); if (d < bd) { bd = d; best = i; } } const lim = s.trafficType === 1 ? 500 : 200; if (bd < lim) { idx = Math.max(idx, best); if (!LN.boarded && best > 0) { LN.boarded = true; LN.boardedAt = Date.now(); } } }
    else if (LN.boarded && s.trafficType === 1 && s.sectionTime) { const per = (s.sectionTime * 60000) / Math.max(1, last); idx = Math.max(idx, Math.min(last - 1, Math.floor((Date.now() - LN.boardedAt) / per))); }
    LN.idx = idx;
    const left = last - idx, unit = s.trafficType === 1 ? "역" : "정류장";
    if (left === 2) fireOnce("l2" + LN.seg, "soon", `2정거장 뒤에 내려요`, `${s.endName}에서 하차`, `두 정거장 뒤 ${s.endName}에서 내립니다.`);
    if (left === 1) fireOnce("l1" + LN.seg, "soon", `다음 ${unit}에서 내려요`, `${s.endName} · 내릴 준비하세요`, `다음 ${unit}은 ${s.endName}입니다. 내릴 준비하세요.`);
    if (left === 0) {
      LN.idx = last; fireOnce("now" + LN.seg, "now", "지금 내리세요", s.endName, `${s.endName}입니다. 지금 내리세요.`);
      if (!LN.leaveAt) LN.leaveAt = Date.now() + (LN.sim ? 2500 : 15000);
    }
    if (LN.leaveAt && Date.now() >= LN.leaveAt) { LN.leaveAt = 0; liveAdvance(); return; }
  }
  if (!liveSkipRender()) renderLive();
}
const liveSkipRender = () => !$("#layer .sheet[data-cls=live]");
function liveAdvance(){
  if (LN.seg >= LN.path.subPath.length - 1) { liveAlert("now", "도착했어요", "안내를 마칠게요.", "목적지에 도착했습니다."); liveStop(false); return; }
  LN.seg++; LN.idx = 0; LN.boarded = false; LN.leaveAt = 0; segIntro(); if (LN.sim) LN.simT = 0; renderLive();
}
/* simulation: moves a fake position along the path so the alerts can be shown indoors */
function liveSimStart(){
  LN.sim = true; LN.simT = 0;
  LN.simTimer = setInterval(() => {
    if (!LN) return; const s = LN.path.subPath[LN.seg]; LN.simT++;
    let pos;
    if (s.trafficType === 3) { const nx = LN.path.subPath[LN.seg + 1]; const a = {x:s.startX, y:s.startY}, b = nx ? (nx.passStopList ? nx.passStopList.stations[0] : {x:nx.startX, y:nx.startY}) : {x:s.endX, y:s.endY}; const f = Math.min(1, LN.simT / 4); pos = {x:a.x + (b.x - a.x) * f, y:a.y + (b.y - a.y) * f}; if (!nx && f >= 1) { liveAdvance(); return; } }
    else { const st = s.passStopList.stations; const i = Math.min(st.length - 1, Math.floor(LN.simT / 2)); pos = st[i]; if (i > 0) { LN.boarded = true; LN.boardedAt = LN.boardedAt || Date.now(); } }
    liveTick({...pos, acc:15, t:Date.now()});
  }, 1500);
}
function liveStop(quiet){
  if (!LN) return;
  if (LN.watch != null) try { navigator.geolocation.clearWatch(LN.watch); } catch(e){}
  clearInterval(LN.clock); clearInterval(LN.simTimer);
  try { LN.wake && LN.wake.release(); } catch(e){}
  const keep = {from:LN.from, to:LN.to, q:LN.q, fromQ:LN.fromQ};
  LN = null;
  if (!quiet) { LN = {step:"setup", results:[], paths:[], fromResults:[], ...keep}; renderLive(); }
}

const addMin = (d, m) => { const x = new Date(d); x.setMinutes(x.getMinutes() + m); return x; };
function placeLabel(p){ if (!p) return ""; if (p.id === S.places.home) return "집 · " + p.name; if (p.id === S.places.work) return (S.places.hasJob === false ? "자주 가는 곳 · " : "회사 · ") + p.name; return p.name; }
function commuteBody(){
  const now = new Date(), h = now.getHours(), morning = h < 14;
  const ev = focusEvent(), pack = packOf(ev);
  const R = getRoutes(), rk = routeKey(), r = R ? R[rk] : null;
  const f = placeById(S.commute.fromId), t = placeById(S.commute.toId);
  const target = S.events.filter(e => ddays(e.start) === (morning ? 0 : 1)).sort((a, b) => new Date(a.start) - new Date(b.start))[0];
  const leave = r && target && morning ? addMin(target.start, -(r.total + 10)) : null;
  const posture = S.commute.posture;
  const optRow = k => {
    const o = R[k], lm = learnMin(o);
    const fast = k !== "C" && R.A.total !== R.B.total && o.total === Math.min(R.A.total, R.B.total);
    const most = k !== "C" && learnMin(R.A) !== learnMin(R.B) && lm === Math.max(learnMin(R.A), learnMin(R.B));
    const pos = k === "C" ? "car" : posture, plan = {};
    o.segs.forEach((sg, i) => { const fm0 = k === rk ? fmtFor(sg, pos, i) : {f:fmtOptions(sg, pos)[0], ...FMTS[fmtOptions(sg, pos)[0]]}; if (fm0.f === "none") return; plan[fm0.name] = (plan[fm0.name] || 0) + sg.min; });
    return `<button class="ropt" data-act="route" data-r="${k}" aria-pressed="${rk === k}">
      <div class="row between"><span class="big-min">${o.total}<small>분</small></span><span class="muted">${fmtTime(addMin(leave || now, o.total))} 도착${k === "C" ? "" : " · 환승 " + o.transfers + "회"}</span></div>
      <div class="segline">${o.segs.map(sg => `<span style="flex:${Math.max(sg.min, 3)};background:${LINE[sg.line].c}${sg.line === "walk" ? ";opacity:.5" : ""}">${sg.min >= 7 ? sg.min + "분" : ""}</span>`).join("")}</div>
      <div class="row wrap" style="gap:6px">${most ? `<span class="chip ok">학습 많음</span>` : ""}${fast ? `<span class="chip blue">가장 빠름</span>` : ""}<span class="learn-chip">${ic("spk", 18)} 학습 ${lm}분</span></div>
      <div class="rplan">${Object.entries(plan).map(([n, m]) => `<span>${esc(n)} ${m}분</span>`).join("")}</div>
    </button>`;
  };
  const pos2 = S.commute.mode === "car" ? "car" : posture;

/* sort expressions by what they do in a conversation */
function exprCat(x){
  const e = (x.en || "").trim();
  if (/confirm|just to (be sure|check|confirm)|so you mean|right\?$|that works|that's right|got it/i.test(e)) return "conf";
  if (/\b(could|can|would|will) you\b|please|would it be possible|^could i\b|^can i (get|have)|^may i\b|i'd like to|i'll have|let me|shall we|let's\b|^a table for/i.test(e)) return "req";
  if (/\?$/.test(e)) return "ask";
  return "tell";
}

async function playLines(){

function emailFallback(sc, text){
  const res = sc.checks.map(c => c.re.test(text));
  const miss = res.findIndex(x => !x);
  const fixes = [];
  WORD_FIXES.forEach(w => { const m = text.match(w.re); if (m && fixes.length < 2) fixes.push({original:m[0], better:w.better, why:w.why}); });
  const good = res[0] ? "인사로 시작해 메일의 목적이 분명해요." : "요청을 직접적으로 전달했어요.";
  let polished = text;
  WORD_FIXES.forEach(w => { polished = polished.replace(w.re, w.better); });
  return {reply: miss === -1 ? sc.goodReply : sc.missingReply[miss] || sc.missingReply[0], achieved: miss === -1, checklist: sc.checks.map((c, i) => ({item:c.label, ok:res[i]})), good, fixes, polished: miss === -1 ? polished : polished + "\n\n" + sc.hints[miss]};
}

/* re-render inside sheets without stopping speech */
const _sheet = sheet;
function patchSheet(title, body, foot, cls){
  const el = $("#layer > .sheet");
  if (!el || !el.querySelector(".sheet-in") || el.classList.contains("onb") || (el.dataset.cls || "") !== (cls || "")) return false;
  const h = el.querySelector(".sheet-head h2"), sb = el.querySelector("#sb"), sameTitle = h && h.innerHTML === String(title);
  const st = sb ? sb.scrollTop : 0;
  if (h && !sameTitle) h.innerHTML = title;
  if (sb) sb.innerHTML = body;
  let f = el.querySelector(".sheet-foot");
  if (foot) { if (!f) { f = document.createElement("div"); f.className = "sheet-foot"; el.querySelector(".sheet-in").appendChild(f); } f.innerHTML = foot; } else if (f) f.remove();
  if (sb) sb.scrollTop = sameTitle ? st : 0;
  return true;
}
sheet = function(title, body, foot, cls){
  if (!sheetNoStop) stopSpeak();
  if (patchSheet(title, body, foot, cls)) return;
  if (sheetNoStop) {
    $("#layer").innerHTML = `<div class="sheet ${cls || ""}" data-cls="${cls || ""}" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]+>/g, ""))}"><div class="sheet-in"><div class="sheet-head"><button class="icon-btn" data-act="close" aria-label="닫기">${ic("close")}</button><h2>${title}</h2></div><div class="sheet-body" id="sb">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ""}</div></div>`;
    return;
  }
  return _sheet(title, body, foot, cls);
};
